# ./config/nginx/planning.conf
# planning.racines-perspectives.fr  ->  application Node « rp-planning » qui
# tourne sur l'HÔTE (pm2, port 2124, écoute sur 172.17.0.1), jointe via
# host.docker.internal (extra_hosts dans docker-compose.yml).
#
# Redirection HTTP -> HTTPS et challenge ACME : gérés par le bloc
# `listen 80 default_server` de sites.conf.
#
# Source : /home/ubuntu/rp-planning/deploy/planning.conf — copié ici par
# /home/ubuntu/rp-planning/deploy/activate.sh une fois le certificat obtenu.

server {
    listen 443 ssl;
    http2 on;
    server_name planning.racines-perspectives.fr;

    ssl_certificate     /etc/letsencrypt/live/planning.racines-perspectives.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planning.racines-perspectives.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://host.docker.internal:2124;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
